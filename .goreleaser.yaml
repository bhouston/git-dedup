# Builds and publishes the native git-dedup binary. See RELEASING.md.
#   goreleaser release --snapshot --clean   # local or CI dry run into dist/
# Publishing steps skip themselves when their credentials are unset or empty.
version: 2
project_name: git-dedup

builds:
  - id: git-dedup
    main: ./cmd/git-dedup
    binary: git-dedup
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: '{{ .CommitTimestamp }}'
    hooks:
      post:
        # Authenticode-signs Windows binaries before archiving; a no-op without Azure Artifact Signing credentials.
        - cmd: sh scripts/sign-windows.sh "{{ .Path }}" "{{ .Os }}"
          output: true

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

notarize:
  macos:
    # Signs and notarizes the macOS binaries from any OS (through quill) when the Apple credentials are set.
    - enabled: '{{ if index .Env "MACOS_SIGN_P12" }}true{{ else }}false{{ end }}'
      sign:
        certificate: '{{ index .Env "MACOS_SIGN_P12" }}'
        password: '{{ index .Env "MACOS_SIGN_PASSWORD" }}'
      notarize:
        issuer_id: '{{ index .Env "MACOS_NOTARY_ISSUER_ID" }}'
        key_id: '{{ index .Env "MACOS_NOTARY_KEY_ID" }}'
        key: '{{ index .Env "MACOS_NOTARY_KEY" }}'
        wait: true

nfpms:
  - id: packages
    package_name: git-dedup
    vendor: Ben Houston
    maintainer: Ben Houston <ben@ben3d.ca>
    homepage: https://git-dedup.ben3d.ca
    description: Faster checkouts, a fraction of the disk space. Shares one copy of Git history across clones, worktrees, and submodules.
    license: MIT
    section: vcs
    formats: [deb, rpm, apk, archlinux]
    dependencies: [git]
    file_name_template: '{{ .ConventionalFileName }}'
    contents:
      - src: LICENSE
        dst: /usr/share/doc/git-dedup/copyright
        packager: deb
      - src: LICENSE
        dst: /usr/share/licenses/git-dedup/LICENSE
        packager: rpm

homebrew_casks:
  - name: git-dedup
    repository:
      owner: bhouston
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}'
    homepage: https://git-dedup.ben3d.ca
    description: Share one copy of Git history across clones, worktrees, and submodules
    license: MIT
    dependencies:
      - formula: git
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'

scoops:
  - name: git-dedup
    repository:
      owner: bhouston
      name: scoop-bucket
      token: '{{ index .Env "SCOOP_BUCKET_GITHUB_TOKEN" }}'
    homepage: https://git-dedup.ben3d.ca
    description: Share one copy of Git history across clones, worktrees, and submodules
    license: MIT
    depends: [git]
    skip_upload: '{{ if index .Env "SCOOP_BUCKET_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'

winget:
  - name: git-dedup
    publisher: Ben Houston
    package_identifier: bhouston.git-dedup
    short_description: Share one copy of Git history across clones, worktrees, and submodules
    license: MIT
    homepage: https://git-dedup.ben3d.ca
    publisher_url: https://github.com/bhouston
    dependencies:
      - package_identifier: Git.Git
    repository:
      # A fork of microsoft/winget-pkgs; GoReleaser pushes a branch and opens a pull request upstream.
      owner: bhouston
      name: winget-pkgs
      branch: 'git-dedup-{{ .Version }}'
      token: '{{ index .Env "WINGET_GITHUB_TOKEN" }}'
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    skip_upload: '{{ if index .Env "WINGET_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'

release:
  # semantic-release creates the GitHub Release; GoReleaser adds the native artifacts to it.
  mode: append

changelog:
  disable: true
