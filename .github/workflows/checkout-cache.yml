name: self-hosted checkout cache proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-cache:
    runs-on: [self-hosted, Linux]
    # Provision git-dedup with pool-backed fetch support on the runner once.
    # Both checkouts use the runner's global settings without a git shim.
    steps:
      - name: First checkout
        uses: bhouston/checkout-git-dedup@main
        with:
          path: cache-first
          fetch-depth: 1
          persist-credentials: false
      - name: Second checkout
        uses: bhouston/checkout-git-dedup@main
        with:
          path: cache-second
          fetch-depth: 1
          persist-credentials: false
      - name: Verify both checkouts borrow full history
        shell: bash
        run: |
          cmp cache-first/.git/objects/info/alternates cache-second/.git/objects/info/alternates
          for repo in cache-first cache-second; do
            test "$(git -C "$repo" rev-parse --is-shallow-repository)" = false
            test -z "$(find "$repo/.git/objects/pack" -name '*.pack' -print -quit)"
            git -C "$repo" fsck --full
          done
