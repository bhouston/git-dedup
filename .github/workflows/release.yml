name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and preview the release without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require dispatch against main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release must be dispatched with ref=main (got ${{ github.ref }})."
          exit 1

  checks:
    needs: guard
    uses: ./.github/workflows/ci.yml

  release:
    needs: [guard, checks]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify main has not advanced since dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::main moved from $GITHUB_SHA to $head after dispatch; dispatch the release again."
            exit 1
          fi
      # The npm package ships native binaries that semantic-release builds with the released version.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Release
        run: pnpm release ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Find the released tag
        id: tag
        if: ${{ !inputs.dry_run }}
        run: |
          # The version bump semantic-release wrote is not committed; GoReleaser requires a clean tree.
          git checkout -- .
          echo "tag=$(git tag --points-at HEAD --list 'v*' | head -n 1)" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action/download-syft@v0
        if: steps.tag.outputs.tag != ''
      # Adds archives, checksums, SBOMs, and Linux packages to the GitHub Release semantic-release created.
      # Homebrew, Scoop, winget, and signing each run only once their secrets exist (see RELEASING.md).
      - uses: goreleaser/goreleaser-action@v6
        if: steps.tag.outputs.tag != ''
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      - name: Summary
        if: inputs.dry_run
        run: echo "Dry run complete; nothing was published and no tag was created." >> "$GITHUB_STEP_SUMMARY"
